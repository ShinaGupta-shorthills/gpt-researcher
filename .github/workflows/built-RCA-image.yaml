name: RCA Bot - Build & Deploy (ACR + Rollback)

on:

  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    env:
      # SAME ACR (already working)
      ACR_NAME: PartsgenieAiAcr
      ACR_LOGIN_SERVER: partsgenieaiacr-b9hpeqe9angfhqfz.azurecr.io

      # RCA-specific
      IMAGE_NAME: partsgenie-rca-backend
      CONTAINER_APP: partsgenie-fresh-rca
      RESOURCE_GROUP: Partsgenie
      BACKEND_URL: https://partsgenie-fresh-rca.lemonisland-b2ee0da0.eastus2.azurecontainerapps.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          docker system prune -af
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      # Azure login (MANDATORY)
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Login to SAME ACR
      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      # Capture current image (rollback-safe)
      - name: Get current running image
        run: |
          CURRENT_IMAGE=$(az containerapp show \
            -n ${{ env.CONTAINER_APP }} \
            -g ${{ env.RESOURCE_GROUP }} \
            --query "properties.template.containers[0].image" -o tsv || echo "")
          echo "CURRENT_IMAGE=$CURRENT_IMAGE" >> $GITHUB_ENV

      # Build & push RCA image
      - name: Build & Push RCA image to ACR
        run: |
          IMAGE_TAG=v${{ github.run_number }}
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

          docker build \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG .

          docker push \
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG

      # Deploy to Azure Container App
      - name: Deploy RCA to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP }}
          imageToDeploy: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # Health check (root endpoint)
      - name: Health check
        run: |
          for i in {1..6}; do
            if curl -f ${{ env.BACKEND_URL }}/; then
              echo "Health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed"
          exit 1

      # Rollback on failure
      - name: Rollback on failure
        if: failure() && env.CURRENT_IMAGE != ''
        run: |
          echo "ROLLING BACK TO $CURRENT_IMAGE"
          az containerapp update \
            -n ${{ env.CONTAINER_APP }} \
            -g ${{ env.RESOURCE_GROUP }} \
            --image $CURRENT_IMAGE

      - name: Success
        if: success()
        run: |
          echo "✅ RCA Backend Deployed Successfully"
          echo "Version: v${{ env.IMAGE_TAG }}"
          echo "URL: ${{ env.BACKEND_URL }}"
